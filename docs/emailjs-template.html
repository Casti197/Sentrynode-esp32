<!-- Plantilla de correo para EmailJS: pégala en Content → "Edit Content" → modo código (<>) -->
<div style="font-family: Arial, sans-serif; max-width: 520px; margin: auto; background: #0f131c; color: #dfe2ef; border-radius: 12px; overflow: hidden;">
  <div style="background: #690005; color: #ffdad6; padding: 16px 20px;">
    <div style="font-size: 12px; letter-spacing: 1px;">SENTRYNODE · ALERTA</div>
    <div style="font-size: 20px; font-weight: bold;">{{alert_type}}</div>
  </div>
  <div style="padding: 20px;">
    <p style="margin: 0 0 12px;">{{alert_description}}</p>
    <table style="width: 100%; font-size: 14px; border-collapse: collapse;">
      <tr><td style="color: #869397; padding: 4px 0;">Hora</td><td>{{alert_timestamp}}</td></tr>
      <tr><td style="color: #869397; padding: 4px 0;">Modo</td><td>{{security_mode}}</td></tr>
      <tr><td style="color: #869397; padding: 4px 0;">Cámara</td><td>{{esp32_ip}}</td></tr>
    </table>
    <p style="margin: 16px 0 0; color: #869397; font-size: 13px;">La foto del evento va adjunta (intruso.jpg).</p>
  </div>
</div>
